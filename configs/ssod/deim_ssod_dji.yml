# DEIM 半监督训练配置（参考 Semi-DETR 120k）
#
# 使用方式：
#   python train_ssod.py -c configs/ssod/deim_ssod_dji.yml
#   python train_ssod.py -c configs/ssod/deim_ssod_dji.yml --num-gpus 4

__include__: [
  '../dataset/dji_detection_ssod.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2_ssod.yml',
]

# ============================================================================
# 输出目录
# ============================================================================
output_dir: ./outputs/deim_ssod_dji

# ============================================================================
# DDP 设置
# ============================================================================
find_unused_parameters: True

# ============================================================================
# Semi-DETR 超参数（参考 Semi-DETR 120k 配置）
# ============================================================================

# 总迭代数
ssl_total_iters: 120000

# 无监督损失权重
ssl_lambda_u: 4.0

# 无监督损失 warmup 迭代数
ssl_warmup_iters: 12000

# EMA 配置
ssl_ema_momentum: 0.999
ssl_ema_warmup: 100

# 伪标签过滤
conf_thresh: 0.5
ssl_pseudo_nms_iou: 0.5

# 无监督损失稳定性
ssl_loss_clip: 50.0

# ============================================================================
# Semi-DETR 核心模块
# ============================================================================

# 1. Stage-wise Hybrid Matching
ssl_use_hybrid_matching: True
ssl_hybrid_topk: 13
ssl_warm_up_step: 60000

# 2. Cross-view Query Consistency
ssl_consistency_weight: 1.0
ssl_consistency_type: 'semi_detr'

# ============================================================================
# 模型配置（使用 DINOv3 backbone）
# ============================================================================
eval_spatial_size: [800, 800]

DEIM:
  backbone: DINOv3STAs

DINOv3STAs:
  name: dinov3_vits16plus
  weights_path: ./ckpts/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
  interaction_indexes: [5, 8, 11]
  finetune: True
  conv_inplane: 64
  hidden_dim: 256

HybridEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  expansion: 1.25
  depth_mult: 1.37
  use_hsv_branch: False

DEIMTransformer:
  num_classes: 2
  num_layers: 6
  eval_idx: -1
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 2048

PostProcessor:
  num_top_queries: 100

# ============================================================================
# 优化器配置
# ============================================================================
optimizer:
  type: AdamW
  params:
    - params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00001
    - params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00001
      weight_decay: 0.
    - params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

clip_max_norm: 0.1

# ============================================================================
# 训练配置
# ============================================================================
epoches: 240

lrsheduler: flatcosine
lr_gamma: 0.1
warmup_iter: 2000
flat_epoch: 180
no_aug_epoch: 24

# ============================================================================
# 数据增强
# ============================================================================
train_dataloader:
  total_batch_size: 2
  num_workers: 4
  persistent_workers: True
  pin_memory: True
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.5}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 75, 150]
  collate_fn:
    base_size: 800
    mixup_prob: 0.0
    ema_restart_decay: 0.9999
    base_size_repeat: 20
    mixup_epochs: [4, 75]
    stop_epoch: 150
    copyblend_epochs: [4, 150]
    copyblend_prob: 0.0

val_dataloader:
  num_workers: 2
  persistent_workers: False
  pin_memory: True
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

DEIMCriterion:
  num_classes: 2
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  alpha: 0.5
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2.0, cost_bbox: 5.0, cost_giou: 2.0}
    alpha: 0.25
    gamma: 2.0
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 180
