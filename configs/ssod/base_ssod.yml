# Semi-DETR 风格半监督训练基础配置
#
# 这是一个基础配置文件，包含 Semi-DETR 的核心超参数
# 具体项目应该继承此配置并覆盖数据集相关配置

# ============================================================================
# Semi-DETR 核心超参数
# ============================================================================

# 总迭代数（Semi-DETR 120k / 180k）
total_iters: 120000

# 无监督损失权重
unsup_weight: 4.0

# 无监督损失 warmup 迭代数
# Semi-DETR: weight = weight * (step - 1) / warmup
warmup_iters: 12000

# 伪标签置信度阈值
pseudo_label_score_thr: 0.5

# 最小伪标签框尺寸
min_pseudo_box_size: 0

# ============================================================================
# EMA Teacher 配置
# ============================================================================

# EMA 动量（目标值）
# Semi-DETR 默认 0.999
ema_momentum: 0.999

# EMA 动量 warmup 步数
# Semi-DETR: momentum = min(target, 1 - (1 + warm_up) / (step + 1 + warm_up))
ema_warmup: 100

# ============================================================================
# Stage-wise Hybrid Matching（可选）
# ============================================================================

# 是否使用混合匹配
use_hybrid_matching: false

# 一对多匹配的 topk
hybrid_topk: 13

# warm-up 步数（前 N 步使用 O2M，之后使用 O2O）
warm_up_step: 60000

# ============================================================================
# GMM 伪标签筛选（可选）
# ============================================================================

# 是否使用 GMM 筛选
use_gmm_filter: false

# GMM 协方差类型
gmm_covariance_type: diag

# ============================================================================
# Cross-view Query Consistency（可选）
# ============================================================================

# 是否使用一致性损失
use_consistency_loss: false

# 一致性损失权重
consistency_weight: 1.0

# ============================================================================
# 训练配置
# ============================================================================

# Epoch 数
epochs: 240

# 学习率
lr: 0.0001
min_lr: 0.000001
weight_decay: 0.0001

# 梯度裁剪
clip_max_norm: 0.1

# 评估间隔
eval_interval: 5

# 打印频率
print_freq: 50

# ============================================================================
# 数据增强配置
# ============================================================================

# 图像尺寸
img_size: [800, 800]

# 弱增广参数
weak_aug:
  flip_prob: 0.5

# 强增广参数
strong_aug:
  flip_prob: 0.5
  color_jitter_prob: 0.8
  grayscale_prob: 0.2
  blur_prob: 0.5
  cutout_prob: 0.5
  cutout_ratio: 0.3

# ============================================================================
# 其他配置
# ============================================================================

# AMP
use_amp: true

# 随机种子
seed: 42

# 设备
device: cuda

