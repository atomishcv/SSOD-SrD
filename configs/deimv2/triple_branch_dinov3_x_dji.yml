__include__: [
  '../dataset/dji_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# 🔥 多GPU训练时配置
# - num_workers 设置为 0 可以避免数据加载器死锁
# - total_batch_size 必须能被 GPU 数量整除
train_dataloader:
  num_workers: 0
  total_batch_size: 2  # 2 GPUs, 每个 GPU batch_size=1

val_dataloader:
  num_workers: 0
  total_batch_size: 2

output_dir: ./outputs/deim_dinov3_x_dji_two_categories

# 使用单分支模型（覆盖基础配置）
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor

DEIM:
  backbone: DINOv3STAs
  encoder: HybridEncoder
  decoder: DEIMTransformer

DINOv3STAs:
  name: dinov3_vits16plus
  weights_path: ./ckpts/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
  interaction_indexes: [5,8,11]   # only need the [1/8, 1/16, 1/32]
  finetune: True
  conv_inplane: 64
  hidden_dim: 256

HybridEncoder:
  in_channels: [256, 256, 256]  # 覆盖：DINOv3输出通道数
  # cross 
  expansion: 1.25  # 覆盖：与原始配置不同
  depth_mult: 1.37  # 覆盖：与原始配置不同

# 单分支解码器配置（覆盖基础配置）
DEIMTransformer:
  num_classes: 2  # 2个类别：0=small, 1=big
  hidden_dim: 256
  num_queries: 300
  
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  num_levels: 3
  num_points: [3, 6, 3]
  nhead: 8
  
  # 解码器层数
  num_layers: 6
  eval_idx: -1
  
  dim_feedforward: 2048
  dropout: 0.
  activation: 'silu'
  
  # 去噪训练
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  
  aux_loss: True
  cross_attn_method: 'default'
  query_select_method: 'default'
  reg_max: 32
  reg_scale: 4.
  layer_scale: 1
  mlp_act: 'silu'
  use_gateway: True

# 单分支损失配置（覆盖基础配置）
DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  num_classes: 2  # 2个类别：0=small, 1=big
  use_uni_set: True
  
  # 匹配器配置
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

## Optimizer（覆盖基础配置）
optimizer:
  type: AdamW

  params: 
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'  
      lr: 0.00001
    -
      # including all norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'    
      lr: 0.00001
      weight_decay: 0.
    - 
      # including all norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sta|encoder|decoder|fusion))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

# Training epochs（覆盖基础配置）
epoches: 132 # 120 + 4n

## Our LR-Scheduler（覆盖基础配置）
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 64    # 4 + epoch // 2
no_aug_epoch: 12

## Our DataAug
train_dataloader:
  dataset: 
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 64, 120]   # list 

  collate_fn:
    base_size: 800
    mixup_prob: 0.5
    ema_restart_decay: 0.9999
    base_size_repeat: 20
    mixup_epochs: [4, 64]
    stop_epoch: 120
    copyblend_epochs: [4, 120]

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

